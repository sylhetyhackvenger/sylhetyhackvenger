<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">THE-ERROR808 — Cyber Operations Animation</title>
  <desc id="desc">Stylized cinematic night scene of a hooded hacker seated at a desk, alternating attention between a Kali Linux laptop and an Android phone showing a Termux-style terminal. Animated typing, terminal output, cyber threat map pulses, network arcs, rain, and screen scan effects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050c"/><stop offset=".5" stop-color="#08162a"/><stop offset="1" stop-color="#170821"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061b2b"/><stop offset="1" stop-color="#02080f"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263d54"/><stop offset=".45" stop-color="#0a1422"/><stop offset="1" stop-color="#24152e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b6ffff"/><stop offset=".45" stop-color="#00eaff"/><stop offset="1" stop-color="#347aff"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4bd8"/><stop offset="1" stop-color="#9657ff"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop offset="0" stop-color="#00eaff" stop-opacity=".22"/><stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#53dff4" stroke-opacity=".08"/>
      <circle cx="0" cy="0" r="1" fill="#53dff4" fill-opacity=".25"/>
    </pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="frame"><rect width="1600" height="1000" rx="22"/></clipPath>
    <clipPath id="laptopScreen"><path d="M275 420L690 370L714 622L294 660Z"/></clipPath>
    <clipPath id="phoneScreen"><rect x="1114" y="517" width="112" height="218" rx="12"/></clipPath>
    <g id="rainDrop"><path d="M0 0l-10 35" stroke="#72faff" stroke-width="1.2" stroke-opacity=".6"/></g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="1000" fill="url(#bg)"/>
    <rect width="1600" height="1000" fill="url(#grid)"/>
    <ellipse cx="720" cy="450" rx="720" ry="600" fill="url(#ambient)"/>
    <ellipse cx="1350" cy="300" rx="400" ry="320" fill="#a52eff" opacity=".06" filter="url(#bloom)"/>

    <!-- Rainy skyline through glass -->
    <g opacity=".65">
      <path d="M0 390V260H65V200H105V325H160V220H220V370H278V280H330V390Z" fill="#08182b" stroke="#143c55" stroke-width="2"/>
      <path d="M970 390V245H1010V180H1065V300H1110V210H1160V340H1210V165H1260V310H1310V240H1370V390Z" fill="#091a2e" stroke="#234560" stroke-width="2"/>
      <path d="M1210 165v-52h50v52M1235 113V85" fill="none" stroke="#ff4bd8" stroke-width="3" filter="url(#glow)"/>
      <path d="M1065 180v-36h55v36" fill="none" stroke="#00eaff" stroke-width="3" filter="url(#glow)"/>
      <g fill="#42e8ff" opacity=".45">
        <path d="M20 285h8v16h-8zm20 0h8v16h-8zm0 28h8v16h-8zm48-78h8v16h-8zm0 28h8v16h-8z"/>
        <path d="M1020 280h8v16h-8zm20 0h8v16h-8zm80-30h8v16h-8zm0 28h8v16h-8zm110-60h8v16h-8zm0 28h8v16h-8zm55 25h8v16h-8z"/>
      </g>
    </g>
    <g opacity=".45">
      <use href="#rainDrop" x="70" y="-20"/><use href="#rainDrop" x="170" y="100"/><use href="#rainDrop" x="280" y="-60"/>
      <use href="#rainDrop" x="950" y="40"/><use href="#rainDrop" x="1080" y="-30"/><use href="#rainDrop" x="1290" y="80"/><use href="#rainDrop" x="1480" y="-50"/>
      <animateTransform attributeName="transform" type="translate" values="0 -100;0 220" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Floating cyber-threat map HUD in background -->
    <g transform="translate(1190 85)">
      <path d="M0 0H320L340 20V300H0Z" fill="#06101f" fill-opacity=".88" stroke="#00eaff" stroke-opacity=".65" stroke-width="1.5"/>
      <text x="18" y="28" fill="#8dfaff" font-family="monospace" font-size="13" letter-spacing="2">GLOBAL THREAT MAP / SIM</text>
      <path d="M18 42H320" stroke="#21465c"/>
      <!-- Abstract world map -->
      <g fill="#16344a" stroke="#2c718a" stroke-width="1.2" opacity=".95">
        <path d="M35 82l22-13 24 4 9 15-12 10-3 18-17 12-12-16-15-4z"/>
        <path d="M87 126l18 5 12 22-6 27-13 16-9-19-8-21z"/>
        <path d="M137 78l18-9 29 5 13 16-15 12-19-3-10 14-19-7z"/>
        <path d="M177 112l19-8 17 11 10 23-13 26-17-9-8-21z"/>
        <path d="M216 82l23-10 36 9 18 18-13 13-22-3-15 14-17-13z"/>
        <path d="M244 142l20-4 17 13-7 21-18 4-14-15z"/>
      </g>
      <g fill="none" stroke="#00eaff" stroke-width="1.5" opacity=".9">
        <path d="M65 104Q140 35 238 99"/><path d="M101 156Q166 80 257 158"/><path d="M152 91Q200 155 266 102"/>
      </g>
      <g>
        <circle cx="65" cy="104" r="4" fill="#ff4bd8" filter="url(#glow)"><animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="238" cy="99" r="4" fill="#00eaff" filter="url(#glow)"><animate attributeName="r" values="3;7;3" dur="2.7s" repeatCount="indefinite"/></circle>
        <circle cx="155" cy="91" r="4" fill="#ff4bd8" filter="url(#glow)"><animate attributeName="r" values="3;8;3" dur="1.8s" repeatCount="indefinite"/></circle>
        <circle cx="257" cy="158" r="4" fill="#00eaff" filter="url(#glow)"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
      </g>
      <path d="M18 214H320" stroke="#21465c"/>
      <text x="18" y="236" fill="#7f9cb5" font-family="monospace" font-size="11">SIGNALS / VISUAL SIMULATION</text>
      <text x="18" y="258" fill="#6effc8" font-family="monospace" font-size="12">● SENSOR GRID NOMINAL</text>
      <text x="18" y="280" fill="#ff8ce6" font-family="monospace" font-size="12">● ANOMALY PULSES DISPLAYED</text>
    </g>

    <!-- Title strip -->
    <g font-family="monospace">
      <path d="M48 52H500L520 72H750" fill="none" stroke="url(#cyan)" stroke-width="2"/>
      <circle cx="48" cy="52" r="4" fill="#00eaff" filter="url(#glow)"/>
      <text x="50" y="94" fill="#7ffaff" font-size="14" letter-spacing="4">THE-ERROR808 // CYBER OPERATIONS</text>
      <text x="50" y="126" fill="#8ba6bf" font-size="12" letter-spacing="2">AUTHORIZED LAB SIMULATION • VISUAL CONCEPT</text>
    </g>

    <!-- Desk and ambient glow -->
    <ellipse cx="760" cy="795" rx="680" ry="130" fill="#00eaff" opacity=".09" filter="url(#bloom)"/>
    <path d="M0 730L1600 700V1000H0Z" fill="#080d17" stroke="#18344a" stroke-width="3"/>
    <path d="M0 746L1600 716" stroke="#00eaff" stroke-opacity=".6" stroke-width="3" filter="url(#glow)"/>
    <path d="M0 760L1600 730" stroke="#a855f7" stroke-opacity=".3" stroke-width="2"/>

    <!-- Chair -->
    <path d="M560 560Q510 520 500 590L478 785H940L910 595Q885 520 820 555Z" fill="#080e18" stroke="#20384b" stroke-width="3"/>
    <path d="M535 615Q710 570 885 615" fill="none" stroke="#00eaff" stroke-opacity=".25" stroke-width="3"/>

    <!-- Body / jacket -->
    <path d="M510 790L535 555Q552 485 638 455L715 445L805 465Q900 495 923 580L970 800Z" fill="url(#hood)" stroke="#24455e" stroke-width="3"/>
    <path d="M635 458L704 540L778 462L807 790H610Z" fill="#0b1624" stroke="#16384e" stroke-width="2"/>
    <path d="M704 540L688 610L720 660L742 610L778 462" fill="none" stroke="#00eaff" stroke-opacity=".55" stroke-width="3"/>
    <path d="M535 575L580 640L550 765M880 565L842 640L900 780" fill="none" stroke="#a855f7" stroke-opacity=".55" stroke-width="3"/>

    <!-- Hood and head, slight repeated look movement -->
    <g>
      <path d="M565 475Q550 340 630 270Q697 214 777 267Q850 320 838 465L808 528L755 563L650 544L594 516Z" fill="url(#hood)" stroke="#31536c" stroke-width="3"/>
      <path d="M603 442Q589 344 649 296Q700 259 750 292Q807 328 804 438L774 486L710 506L646 487Z" fill="#030811" stroke="#1b3b52" stroke-width="2"/>
      <path d="M612 400Q657 370 696 393L675 424L624 431Z" fill="#8dfaff" opacity=".15"/>
      <path d="M803 400Q758 370 719 393L740 424L791 431Z" fill="#c084fc" opacity=".15"/>
      <path d="M615 404L680 421L644 441Z" fill="#7afaff" filter="url(#glow)">
        <animate attributeName="opacity" values=".65;1;.65" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M798 404L733 421L769 441Z" fill="#c084fc" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.5;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M670 469Q708 487 746 469" fill="none" stroke="#00eaff" stroke-width="2" stroke-opacity=".65"/>
      <animateTransform attributeName="transform" type="rotate" values="0 710 430;-2 710 430;1 710 430;0 710 430" dur="6s" repeatCount="indefinite"/>
    </g>

    <!-- Left arm reaching toward laptop keyboard -->
    <path d="M575 555Q525 575 475 634L405 697Q390 714 410 731Q428 742 448 724L535 675L642 625Z" fill="#111d2b" stroke="#2b4a60" stroke-width="3"/>
    <path d="M433 704L486 660L521 678L466 724Z" fill="#17283a" stroke="#00eaff" stroke-opacity=".35" stroke-width="2"/>
    <path d="M404 716Q415 696 438 706L476 725L463 744L424 738Q407 735 404 716Z" fill="#101b29" stroke="#527188" stroke-width="2"/>

    <!-- Laptop body and screen -->
    <path d="M260 421L695 367L727 632L290 681Z" fill="#0b1421" stroke="#53758b" stroke-width="4"/>
    <path d="M275 420L690 372L713 618L294 656Z" fill="url(#screen)" stroke="#00eaff" stroke-width="2"/>
    <g clip-path="url(#laptopScreen)">
      <rect x="265" y="365" width="470" height="310" fill="#020a12"/>
      <rect x="265" y="365" width="470" height="310" fill="url(#grid)" opacity=".8"/>
      <rect x="285" y="389" width="400" height="29" rx="3" fill="#10243a" stroke="#1d5a72"/>
      <circle cx="302" cy="403" r="4" fill="#ff5b91"/><circle cx="316" cy="403" r="4" fill="#ffc857"/><circle cx="330" cy="403" r="4" fill="#6effc8"/>
      <text x="349" y="408" fill="#8cfaff" font-family="monospace" font-size="12">KALI LINUX // TERMINAL</text>
      <g font-family="monospace" font-size="13">
        <text x="292" y="445" fill="#6effc8">┌──(root㉿kali)-[~/lab]</text>
        <text x="292" y="466" fill="#8cfaff">$ whoami</text>
        <text x="292" y="487" fill="#d4eaff">root</text>
        <text x="292" y="508" fill="#8cfaff">$ ip addr show</text>
        <text x="292" y="529" fill="#d4eaff">eth0: state UP</text>
        <text x="292" y="550" fill="#8cfaff">$ python3 audit_lab.py</text>
        <text x="292" y="571" fill="#6effc8">[+] Lab checks initialized</text>
        <text x="292" y="592" fill="#6effc8">[+] Report saved: audit.log</text>
        <text x="292" y="613" fill="#ff91e7">[sim] monitoring events...</text>
        <rect x="292" y="625" width="8" height="15" fill="#00eaff">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        </rect>
        <text x="311" y="637" fill="#8cfaff">_</text>
      </g>
      <rect x="270" y="370" width="450" height="300" fill="url(#scanlines)" opacity=".35"/>
      <rect x="270" y="370" width="450" height="5" fill="url(#cyan)" opacity=".7">
        <animate attributeName="y" values="370;650;370" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- Laptop base -->
    <path d="M290 656L713 618L795 682Q802 692 780 696L354 746Q337 748 326 734Z" fill="#182738" stroke="#55758a" stroke-width="3"/>
    <path d="M340 669L710 635L755 676L380 718Z" fill="#0a121e" stroke="#2d4e64" stroke-width="2"/>
    <path d="M468 681L588 669L609 685L488 698Z" fill="#21384c" stroke="#00eaff" stroke-opacity=".35"/>
    <g stroke="#4a6a80" stroke-width="1" opacity=".8">
      <path d="M365 678l22 25m3-28l22 25m3-28l22 25m3-28l22 25m3-28l22 25m145-47l20 24m3-26l20 24m3-26l20 24"/>
      <path d="M390 710l310-31M403 718l310-31"/>
    </g>
    <path d="M328 735L782 686" stroke="#00eaff" stroke-width="2" stroke-opacity=".65" filter="url(#glow)"/>

    <!-- Right arm to phone -->
    <path d="M836 566Q896 580 960 630L1062 682Q1083 695 1071 716Q1060 734 1035 718L920 669L835 633Z" fill="#121f2d" stroke="#29485e" stroke-width="3"/>
    <path d="M1028 693L1063 673L1090 695L1065 720Z" fill="#17283a" stroke="#00eaff" stroke-opacity=".35" stroke-width="2"/>

    <!-- Android phone with Termux-like terminal -->
    <g transform="rotate(-4 1170 630)">
      <rect x="1098" y="490" width="144" height="272" rx="22" fill="#03070c" stroke="#536b80" stroke-width="4"/>
      <rect x="1110" y="511" width="120" height="232" rx="13" fill="url(#screen)" stroke="#00eaff" stroke-opacity=".65" stroke-width="1.5"/>
      <rect x="1143" y="498" width="54" height="5" rx="2.5" fill="#34475b"/>
      <g clip-path="url(#phoneScreen)" font-family="monospace">
        <rect x="1114" y="517" width="112" height="218" fill="#02070d"/>
        <rect x="1114" y="517" width="112" height="218" fill="url(#grid)" opacity=".6"/>
        <text x="1121" y="540" fill="#6effc8" font-size="10">TERMUX</text>
        <path d="M1120 548H1218" stroke="#28506a"/>
        <text x="1121" y="567" fill="#8dfaff" font-size="10">$ su</text>
        <text x="1121" y="584" fill="#6effc8" font-size="10">root@android</text>
        <text x="1121" y="601" fill="#8dfaff" font-size="10"># id</text>
        <text x="1121" y="618" fill="#e4f8ff" font-size="9">uid=0(root)</text>
        <text x="1121" y="640" fill="#8dfaff" font-size="10"># python</text>
        <text x="1121" y="657" fill="#c6a6ff" font-size="9">lab console ready</text>
        <text x="1121" y="679" fill="#6effc8" font-size="9">[+] session open</text>
        <text x="1121" y="697" fill="#8dfaff" font-size="10"># _</text>
        <rect x="1150" y="685" width="6" height="10" fill="#00eaff">
          <animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/>
        </rect>
      </g>
      <circle cx="1170" cy="752" r="4" fill="#233b50"/>
      <path d="M1114 517H1226" stroke="#00eaff" stroke-width="2" opacity=".6"/>
    </g>

    <!-- Hands and animated typing fingers -->
    <g>
      <path d="M394 706Q412 686 432 700L465 718Q477 725 470 738Q464 748 450 742L415 727Q396 723 394 706Z" fill="#18293a" stroke="#6b8ba0" stroke-width="2"/>
      <path d="M420 703l42 20m-50-7l39 20m-24-38l34 18" fill="none" stroke="#9cb7c8" stroke-opacity=".6" stroke-width="3" stroke-linecap="round">
        <animate attributeName="opacity" values=".35;1;.35" dur=".42s" repeatCount="indefinite"/>
      </path>
      <path d="M1042 698Q1055 676 1076 688L1100 706Q1112 716 1102 729Q1094 739 1081 730L1050 714Q1038 710 1042 698Z" fill="#18293a" stroke="#6b8ba0" stroke-width="2"/>
      <path d="M1062 690l34 26m-40-15l31 24m-15-38l30 22" fill="none" stroke="#9cb7c8" stroke-opacity=".6" stroke-width="3" stroke-linecap="round">
        <animate attributeName="opacity" values="1;.3;1" dur=".5s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Small status widgets around operator -->
    <g font-family="monospace">
      <g transform="translate(60 490)">
        <path d="M0 0H170L185 15V100H0Z" fill="#06111f" fill-opacity=".9" stroke="#00eaff" stroke-opacity=".6"/>
        <text x="14" y="25" fill="#8dfaff" font-size="11">PACKET FLOW</text>
        <path d="M14 70h20l12-26 15 38 14-19h18l12-11 13 18h27" fill="none" stroke="#00eaff" stroke-width="2" filter="url(#glow)">
          <animate attributeName="stroke-dashoffset" values="0;-80" dur="2s" repeatCount="indefinite"/>
        </path>
        <text x="14" y="91" fill="#6effc8" font-size="10">SIMULATED / NOMINAL</text>
      </g>
      <g transform="translate(1370 490)">
        <path d="M0 0H170V100H0Z" fill="#06111f" fill-opacity=".9" stroke="#a855f7" stroke-opacity=".7"/>
        <text x="14" y="25" fill="#c6a6ff" font-size="11">LAB TELEMETRY</text>
        <text x="14" y="49" fill="#dcefff" font-size="11">CPU  ▰▰▰▰▱</text>
        <text x="14" y="69" fill="#dcefff" font-size="11">NET  ▰▰▰▱▱</text>
        <text x="14" y="89" fill="#6effc8" font-size="10">STATUS: READY</text>
      </g>
    </g>

    <!-- Animated attention / interaction indicators -->
    <g fill="none" stroke-width="2">
      <path d="M742 458Q870 420 1090 560" stroke="#00eaff" stroke-opacity=".35" stroke-dasharray="5 9">
        <animate attributeName="stroke-dashoffset" values="0;-56" dur="2.5s" repeatCount="indefinite"/>
      </path>
      <path d="M760 480Q820 540 900 650" stroke="#a855f7" stroke-opacity=".35" stroke-dasharray="4 10">
        <animate attributeName="stroke-dashoffset" values="0;56" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Cursor-like signal sweep over whole scene -->
    <rect x="0" y="0" width="1600" height="3" fill="url(#cyan)" opacity=".5" filter="url(#glow)">
      <animate attributeName="y" values="-5;1000;-5" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect width="1600" height="1000" fill="url(#scanlines)" opacity=".25"/>
    <rect x="2" y="2" width="1596" height="996" rx="20" fill="none" stroke="#46efff" stroke-opacity=".7" stroke-width="3"/>
    <path d="M28 82V28H82M1518 28h54v54M28 918v54h54M1518 972h54v-54" fill="none" stroke="#bd58ff" stroke-width="4"/>
    <text x="800" y="970" text-anchor="middle" fill="#8ba6bf" font-family="monospace" font-size="12" letter-spacing="3">VISUAL CYBER-LAB SIMULATION • NO LIVE THREAT DATA</text>
  </g>
</svg>
