<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="55%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#101027"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b3550" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="1000" height="600" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="600" rx="18" fill="url(#grid)" opacity=".55"/>

  <!-- Header -->
  <path d="M28 75H972" stroke="url(#line)" stroke-width="2" filter="url(#glow)"/>
  <text x="40" y="42" fill="#00f5ff" font-family="monospace"
        font-size="14" letter-spacing="4">THE-ERROR808 // SECURITY DIRECTIVE</text>
  <text x="40" y="65" fill="#a8c7dc" font-family="monospace"
        font-size="10" letter-spacing="2">OPERATIONAL ETHICS • CORE PROTOCOL</text>
  <circle cx="950" cy="40" r="5" fill="#00ff9c">
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="930" y="60" text-anchor="end" fill="#00ff9c"
        font-family="monospace" font-size="9">PROTOCOL ACTIVE</text>

  <!-- Scan line -->
  <rect x="30" y="88" width="940" height="2" fill="#00f5ff" opacity=".45">
    <animate attributeName="y" values="88;550;88" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- Directive rows -->
  <g font-family="monospace">
    <g transform="translate(0 112)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#0c1b2b" stroke="#16415a"/>
      <text x="55" y="12" fill="#00f5ff" font-size="15">01</text>
      <text x="105" y="12" fill="#e5f7ff" font-size="17" font-weight="bold">AUTHORIZATION FIRST</text>
      <text x="940" y="12" fill="#5c8ba5" font-size="10" text-anchor="end">CONSENT > ACCESS</text>
      <rect x="35" y="-17" width="3" height="48" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 178)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#0c1b2b" stroke="#16415a"/>
      <text x="55" y="12" fill="#00f5ff" font-size="15">02</text>
      <text x="105" y="12" fill="#e5f7ff" font-size="17" font-weight="bold">RESEARCH WITH PURPOSE</text>
      <text x="940" y="12" fill="#5c8ba5" font-size="10" text-anchor="end">INTENT > CURIOSITY</text>
      <rect x="35" y="-17" width="3" height="48" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 244)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#0c1b2b" stroke="#16415a"/>
      <text x="55" y="12" fill="#00f5ff" font-size="15">03</text>
      <text x="105" y="12" fill="#e5f7ff" font-size="17" font-weight="bold">VERIFY BEFORE YOU CLAIM</text>
      <text x="940" y="12" fill="#5c8ba5" font-size="10" text-anchor="end">EVIDENCE > ASSUMPTION</text>
      <rect x="35" y="-17" width="3" height="48" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 310)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#0c1b2b" stroke="#16415a"/>
      <text x="55" y="12" fill="#00f5ff" font-size="15">04</text>
      <text x="105" y="12" fill="#e5f7ff" font-size="17" font-weight="bold">RESPECT PRIVACY</text>
      <text x="940" y="12" fill="#5c8ba5" font-size="10" text-anchor="end">DATA MINIMIZATION</text>
      <rect x="35" y="-17" width="3" height="48" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 376)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#0c1b2b" stroke="#16415a"/>
      <text x="55" y="12" fill="#00f5ff" font-size="15">05</text>
      <text x="105" y="12" fill="#e5f7ff" font-size="17" font-weight="bold">DISCLOSE RESPONSIBLY</text>
      <text x="940" y="12" fill="#5c8ba5" font-size="10" text-anchor="end">PROTECT, THEN REPORT</text>
      <rect x="35" y="-17" width="3" height="48" fill="#00f5ff"/>
    </g>
    <g transform="translate(0 442)">
      <rect x="35" y="-17" width="930" height="48" rx="5" fill="#101c30" stroke="#6542a0"/>
      <text x="55" y="12" fill="#c084fc" font-size="15">06</text>
      <text x="105" y="12" fill="#ffffff" font-size="17" font-weight="bold">KEEP BUILDING</text>
      <text x="940" y="12" fill="#b78bea" font-size="10" text-anchor="end">LEARN • IMPROVE • REPEAT</text>
      <rect x="35" y="-17" width="3" height="48" fill="#a855f7"/>
      <rect x="35" y="-17" width="930" height="48" rx="5"
            fill="none" stroke="#a855f7" opacity=".7">
        <animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Footer -->
  <path d="M35 495H965" stroke="#1b4560"/>
  <text x="40" y="522" fill="#00f5ff" font-family="monospace"
        font-size="12" letter-spacing="2">THINK ETHICALLY. TEST LEGALLY. BUILD FEARLESSLY.</text>
  <text x="40" y="548" fill="#607f98" font-family="monospace" font-size="10">
    AUTHORIZED SECURITY RESEARCH // PRIVACY BY DESIGN // CONTINUOUS LEARNING
  </text>
  <text x="960" y="570" fill="#42647d" font-family="monospace"
        font-size="9" text-anchor="end">SYS.DIRECTIVE.v1.0</text>
</svg>
